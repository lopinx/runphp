[package]
name = "runphp-desktop"
description = "RunPHP 桌面端（Tauri 2 壳，薄封装 runphp-core）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "runphp_desktop_lib"
# 仅桌面端：rlib 供本 crate 的 bin 链接。
# 不用 cdylib/staticlib——windows-gnu 目标下符号过多会导致
# "export ordinal too large" 链接错误；移动端目标暂不支持。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
runphp-core = { path = "../crates/runphp-core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[features]
# Tauri 脚手架约定：发布构建启用自定义协议
custom-protocol = ["tauri/custom-protocol"]
